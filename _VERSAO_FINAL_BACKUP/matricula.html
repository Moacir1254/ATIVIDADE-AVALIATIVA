<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrícula - FutGestão</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark menu-topo">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.jpg" alt="Logo FutGestão" class="logo-menu">
                FutGestão
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuLinks">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuLinks">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#sobre">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#categorias">Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#contato">Contato</a></li>
                    <li class="nav-item"><a class="nav-link btn-matricula" href="matricula.html">Matrícula</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="bloco">
        <div class="container">
            <h2>Formulário de Matrícula</h2>
            <p>Preencha os dados abaixo para realizar a pré-matrícula do atleta.</p>

            <div id="mensagemErro" class="alert alert-danger d-none"></div>

            <form id="formMatricula" action="obrigado.html" method="get" class="caixa-form">
                <h4>Dados do Atleta</h4>

                <div class="mb-3">
                    <label for="nomeAtleta" class="form-label">Nome do Atleta</label>
                    <input type="text" id="nomeAtleta" name="nomeAtleta" class="form-control" placeholder="Digite o nome do atleta">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="categoria" class="form-label">Categoria</label>
                        <select id="categoria" name="categoria" class="form-select">
                            <option value="">Selecione</option>
                            <option value="Sub-7">Sub-7</option>
                            <option value="Sub-9">Sub-9</option>
                            <option value="Sub-11">Sub-11</option>
                            <option value="Sub-13">Sub-13</option>
                            <option value="Sub-15">Sub-15</option>
                            <option value="Sub-17">Sub-17</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="posicao" class="form-label">Posição</label>
                    <select id="posicao" name="posicao" class="form-select">
                        <option value="">Selecione</option>
                        <option value="Goleiro">Goleiro</option>
                        <option value="Zagueiro">Zagueiro</option>
                        <option value="Lateral">Lateral</option>
                        <option value="Meio-campo">Meio-campo</option>
                        <option value="Atacante">Atacante</option>
                    </select>
                </div>

                <h4 class="mt-4">Dados do Responsável</h4>

                <div class="mb-3">
                    <label for="nomeResponsavel" class="form-label">Nome do Responsável</label>
                    <input type="text" id="nomeResponsavel" name="nomeResponsavel" class="form-control" placeholder="Digite o nome do responsável">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="telefone" class="form-label">telefone</label>
                        <input type="text" id="telefone" name="telefone" class="form-control" placeholder="(83) 9 0000-0000">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">E-mail</label>
                        <input type="email" id="email" name="email" class="form-control" placeholder="email@exemplo.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Já jogou em outro clube/escolinha?</label>
                    <input type="radio" id="outroSim" name="outroClube" value="Sim">
                    <label for="outroSim">Sim</label>
                    <input type="radio" id="outroNao" name="outroClube" value="Não" checked class="ms-3">
                    <label for="outroNao">Não</label>
                </div>

                <div class="mb-3">
                    <label for="observacoes" class="form-label">Observações</label>
                    <textarea id="observacoes" name="observacoes" rows="3" class="form-control" placeholder="Opcional"></textarea>
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" id="aceito" name="aceito" class="form-check-input">
                    <label for="aceito" class="form-check-label">Confirmo que os dados informados são verdadeiros.</label>
                </div>

                <button type="submit" class="botao-verde">Enviar</button>
                <button type="button" id="btnLimpar" class="btn btn-secondary ms-2">Limpar</button>
            </form>
        </div>
    </section>

    <footer class="rodape">
        <div class="container">
            <p class="text-center mb-0">FutGestão - João Pessoa - PB | (83) 9 9002-8922</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
